<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FileRepair Pro - Réparation de fichiers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .progress-container {
            margin: 30px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            border-radius: 15px;
        }
        
        .status {
            font-size: 1.1rem;
            color: #666;
            margin: 20px 0;
        }
        
        .file-info {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
        
        .file-info p {
            margin: 5px 0;
            color: #333;
        }
        
        .button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .button:hover {
            background: #45a049;
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .error {
            color: #f44336;
            font-weight: 500;
        }
        
        .success {
            color: #4caf50;
            font-weight: 500;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔧 FileRepair Pro</h1>
            <p class="subtitle">Réparation de fichiers en cours</p>
            
            <div id="fileInfo" class="file-info">
                <p><strong>Fichier :</strong> <span id="fileName">-</span></p>
                <p><strong>Taille :</strong> <span id="fileSize">-</span></p>
                <p><strong>Type :</strong> <span id="fileType">-</span></p>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="status" id="status">Initialisation...</div>
            </div>
            
            <div id="actions"></div>
        </div>
    </div>
    
    <script>
        // Récupérer les paramètres de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');
        
        if (fileName) {
            document.getElementById('fileName').textContent = decodeURIComponent(fileName);
        }
        
        // Connexion WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        
        ws.onopen = () => {
            console.log('WebSocket connecté');
            updateStatus('Connecté au serveur', 'normal');
        };
        
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === 'progress') {
                    updateProgress(data.progress, data.status);
                } else if (data.type === 'complete') {
                    onRepairComplete(data.outputFile);
                } else if (data.type === 'error') {
                    onError(data.error);
                }
            } catch (error) {
                console.error('Erreur parsing:', error);
            }
        };
        
        ws.onerror = () => {
            updateStatus('Erreur de connexion au serveur', 'error');
        };
        
        ws.onclose = () => {
            updateStatus('Connexion perdue, tentative de reconnexion...', 'error');
            setTimeout(() => {
                window.location.reload();
            }, 3000);
        };
        
        function updateProgress(progress, status) {
            const progressFill = document.getElementById('progressFill');
            const statusElem = document.getElementById('status');
            
            if (progressFill) {
                progressFill.style.width = progress + '%';
            }
            
            if (statusElem) {
                statusElem.textContent = status;
                
                if (progress === 100) {
                    statusElem.classList.add('success');
                }
            }
        }
        
        function updateStatus(message, type = 'normal') {
            const statusElem = document.getElementById('status');
            if (statusElem) {
                statusElem.textContent = message;
                if (type === 'error') {
                    statusElem.classList.add('error');
                }
            }
        }
        
        function onRepairComplete(outputFile) {
            const actionsDiv = document.getElementById('actions');
            actionsDiv.innerHTML = `
                <button class="button" onclick="downloadFile('${outputFile}')">
                    📥 Télécharger le fichier réparé
                </button>
                <button class="button" onclick="window.location.href='/'">
                    🔄 Réparer un autre fichier
                </button>
            `;
        }
        
        function onError(error) {
            updateStatus(`Erreur: ${error}`, 'error');
            const actionsDiv = document.getElementById('actions');
            actionsDiv.innerHTML = `
                <button class="button" onclick="window.location.href='/'">
                    ↩️ Retour à l'accueil
                </button>
            `;
        }
        
        function downloadFile(filename) {
            window.location.href = `/api/download/${filename}`;
        }
        
        // Démarrer la réparation si un fichier est spécifié
        if (fileName) {
            // Envoyer la demande de réparation via WebSocket
            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'repair',
                    fileName: decodeURIComponent(fileName),
                    fileId: urlParams.get('id') || ''
                }));
            };
        }
    </script>
</body>
</html>
